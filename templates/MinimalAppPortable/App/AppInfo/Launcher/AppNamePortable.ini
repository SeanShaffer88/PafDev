; PortableApps.com Launcher configuration for AppName Portable.
; Rename this file to match your AppID (e.g. AppNamePortable.ini) and keep
; it in App\AppInfo\Launcher\. Every key used here is documented in
; docs/04-launcher-ini-reference.md of the PafDev repo. Only include
; sections your app actually needs.

[Launch]
; Path is relative to the App directory: App\AppName\AppName.exe
ProgramExecutable=AppName\AppName.exe
; Leave both at warn until you have actually designed for and tested
; folder moves / UNC paths (docs/04, docs/08). Claiming yes untested
; ships breakage to exactly the users portability is for.
DirectoryMoveOK=warn
SupportsUNC=warn

[Activate]
; Required because [RegistryKeys] is used below.
Registry=true

; The app's registry key is saved to Data\settings\AppName.reg while
; running; a local copy's key is backed up and restored automatically.
[RegistryKeys]
AppName=HKCU\Software\Publisher\AppName

; Remove the publisher parent key afterwards if the app left it empty.
[RegistryCleanupIfEmpty]
1=HKCU\Software\Publisher

; The app's %APPDATA% folder lives in Data\AppNameConfig while running.
[DirectoriesMove]
AppNameConfig=%APPDATA%\Publisher\AppName

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\Publisher
