; installer.ini is OPTIONAL. Most packages need no installer.ini at all:
; without it the App and Other directories are replaced on upgrade, Data
; is preserved, and the installer follows appinfo.ini's language setting.
;
; Create this file from scratch with ONLY the features your package
; needs. Do not copy a full option list into a project. Every key is
; documented in docs/02-installer-and-installer-ini.md of the PafDev repo.
;
; The example below shows the single most common reason to have this
; file: preserving a user plugins directory across upgrades even though
; the App directory is replaced.

[DirectoriesToPreserve]
PreserveDirectory1=App\AppName\plugins
